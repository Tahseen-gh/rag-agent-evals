name: Evals & SBOM
on:
  push:
  pull_request:
jobs:
  # Retrieval-quality evals (recall/MRR/NDCG on the real corpus, gated on bm25)
  # already run in retrieval-evals.yml - no separate "lite" version here.

  generation-eval:
    runs-on: ubuntu-latest
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Real LLM-judged generation eval (conditional on a key being configured)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.run --backend hybrid --real-llm --llm-judge
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with: { name: generation-eval-report, path: evals/results_summary.json }

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip
          python -m pip install cyclonedx-bom
          cyclonedx-py --e pip --output sbom.xml
      - uses: actions/upload-artifact@v4
        with: { name: sbom-cyclonedx, path: sbom.xml }
